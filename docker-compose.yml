# CodeForge + Redis, tracing to Langfuse Cloud.  Usage: cp .env.docker.example .env.docker && make up   (= docker compose --env-file .env.docker up -d --build)
name: codeforge

x-env-file: &env_file
  env_file: .env.docker

services:
  app:
    build: .
    image: codeforge:latest
    <<: *env_file
    environment:
      CODEFORGE_HOST: 0.0.0.0
      CODEFORGE_DB_URL: sqlite:////data/codeforge.db
      CODEFORGE_CHECKPOINT_PATH: /data/checkpoints.db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      LANGFUSE_HOST: ${LANGFUSE_BASE_URL:-${LANGFUSE_HOST:-https://cloud.langfuse.com}}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      SANDBOX_BACKEND: local
    ports:
      # Loopback only: the UI has demo identity switching and must not be exposed publicly.
      - "127.0.0.1:8501:8501"
    volumes:
      - codeforge-data:/data
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    <<: *env_file
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  codeforge-data:
  redis-data:

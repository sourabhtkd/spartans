[project]
name = "codeforge"
version = "0.1.0"
description = "CodeForge: Multi-agent NL to code system"
readme = "README.md"
authors = [
    { name = "sourabhtkd" }
]
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.46",
    "jinja2>=3.1.6",
    "langchain-core>=1.8.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.8.0",
    "langfuse>=5.2.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "numpy>=2.4.6",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "redis>=5.0",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.1.8",
    "structlog>=26.1.0",
    "indic-pii>=0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codeforge"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "fakeredis>=2.26",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["live: needs real LLM API keys / network (skipped in CI)"]
addopts = "-p no:cacheprovider"

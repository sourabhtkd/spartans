name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Mypy Type Check
        run: uv run mypy codeforge

      - name: Run Unit Tests
        run: uv run pytest tests/unit -q

      - name: Run Golden Gate Evals
        run: uv run pytest evals/test_golden.py -v
